# ---------------------------------------------------------------------------
# CI/CD
#
# Flow (aligned with delupay-admin-web / delupay-fasttrack / merchant-web):
#   - test            : cargo test (every push / MR)
#   - release         : semantic-release on edge/preprod/prod — creates tag
#                       + GitLab Release, emits version.txt
#   - build           : cross-compile 4 targets via cargo-zigbuild, using the
#                       version produced by semantic-release
#   - publish         : upload tarballs to the Generic Package Registry and
#                       attach them as asset links to the existing release
#
# Release branch: `main`.
# Required CI variables: GITLAB_TOKEN (write_repository + api scope).
# ---------------------------------------------------------------------------

stages:
  - test
  - release
  - build
  - publish

variables:
  # CARGO_HOME is set per-job: Linux Docker jobs scope it into the project
  # dir (cacheable); macOS shell jobs let rustup use the default $HOME/.cargo
  # because $HOME is not expanded in this YAML block.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  PACKAGE_NAME: skills-manager
  BINARY_NAME: skills-manager
  PACKAGE_REGISTRY_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME"

# ---------------------------------------------------------------------------
# Paths that must change for a pipeline to build/test/release.
# Pure doc-only commits (README, INSTALL, CONTRIBUTING, LICENSE, claude/,
# opencode/, ...) skip the whole flow — nothing to rebuild or reship.
# ---------------------------------------------------------------------------
.code-paths: &code-paths
  - src/**/*
  - Cargo.toml
  - Cargo.lock
  - .gitlab-ci.yml
  - release.config.cjs
  - release-commit-partial.hbs
  - package.json
  - pnpm-lock.yaml

# ---------------------------------------------------------------------------
# Test — runs on every push and MR.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: rust:1-bookworm
  tags:
    - ci0X-evolix
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  script:
    - cargo test --release --locked
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code-paths
    - if: $CI_COMMIT_BRANCH
      changes: *code-paths

# ---------------------------------------------------------------------------
# Release — semantic-release creates the Git tag + GitLab Release and writes
# the resolved version to version.txt for downstream jobs.
# Mirrors the delupay-admin-web `build:release` step (minus the Vite build).
# ---------------------------------------------------------------------------
release:semantic:
  stage: release
  image: node:24-alpine
  tags:
    - ci0X-evolix
  # Runs on every main commit so docs-only pushes still produce a tag /
  # changelog entry. Builds + publish stay guarded by code-paths — a pure
  # docs release updates the changelog but keeps the existing binaries.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  script:
    - apk update && apk upgrade && apk add --no-cache git jq
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install
    - pnpm semantic-release
    - cat package.json | jq -r '.version' > version.txt
    - |
      if [ "$(cat version.txt)" = "0.0.0-semantically-released" ] || [ "$(cat version.txt)" = "0.0.0" ]; then
        printf 'ERROR: No new version has been tagged\n' >&2
        exit 1
      fi
    - echo "Released version $(cat version.txt)"
  artifacts:
    paths:
      - version.txt
    expire_in: 1 month

# ---------------------------------------------------------------------------
# Linux build — runs in Docker on ci0X-evolix, cross-compiles via
# cargo-zigbuild (one runner covers x86_64 + aarch64 targets).
# ---------------------------------------------------------------------------
.build-linux:
  stage: build
  image: rust:1-bookworm
  tags:
    - ci0X-evolix
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-paths
  needs:
    - release:semantic
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-pip xz-utils
    - pip install --break-system-packages cargo-zigbuild ziglang
    - rustup target add $TARGET
  script:
    - cargo zigbuild --release --locked --target $TARGET
    - mkdir -p dist
    - STAGE="dist/${PACKAGE_NAME}-${PLATFORM}"
    - mkdir -p "$STAGE"
    - cp "target/$TARGET/release/${BINARY_NAME}" "$STAGE/"
    - cp -R claude opencode "$STAGE/"
    - cp LICENSE README.md "$STAGE/"
    - ARCHIVE="${PACKAGE_NAME}-${PLATFORM}.tar.gz"
    - tar -C dist -czf "dist/${ARCHIVE}" "${PACKAGE_NAME}-${PLATFORM}"
    - rm -rf "$STAGE"
    - (cd dist && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
  artifacts:
    paths:
      - dist/
      - version.txt
    expire_in: 1 week

# ---------------------------------------------------------------------------
# macOS build — runs natively on the `macos` runner (shell executor, no
# Docker). Cross-compile is handled by Apple's toolchain, no zigbuild needed.
# Assumes rustup is provisioned on the runner.
# ---------------------------------------------------------------------------
.build-macos:
  stage: build
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-paths
  needs:
    - release:semantic
  # No CARGO_HOME override here: $HOME is not expanded in YAML `variables:`,
  # so setting CARGO_HOME: "$HOME/.cargo" resolves to "/.cargo" (read-only).
  # Let rustup pick its default $HOME/.cargo when spawned in the shell.
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - target/
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        export PATH="$HOME/.cargo/bin:$PATH"
      fi
    - rustup target add $TARGET
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo build --release --locked --target $TARGET
    - mkdir -p dist
    - STAGE="dist/${PACKAGE_NAME}-${PLATFORM}"
    - mkdir -p "$STAGE"
    - cp "target/$TARGET/release/${BINARY_NAME}" "$STAGE/"
    - cp -R claude opencode "$STAGE/"
    - cp LICENSE README.md "$STAGE/"
    - ARCHIVE="${PACKAGE_NAME}-${PLATFORM}.tar.gz"
    - tar -C dist -czf "dist/${ARCHIVE}" "${PACKAGE_NAME}-${PLATFORM}"
    - rm -rf "$STAGE"
    - (cd dist && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
  artifacts:
    paths:
      - dist/
      - version.txt
    expire_in: 1 week

build:linux-x86_64:
  extends: .build-linux
  variables:
    TARGET: x86_64-unknown-linux-gnu
    PLATFORM: linux-x86_64

build:linux-aarch64:
  extends: .build-linux
  variables:
    TARGET: aarch64-unknown-linux-gnu
    PLATFORM: linux-aarch64

build:macos-x86_64:
  extends: .build-macos
  variables:
    TARGET: x86_64-apple-darwin
    PLATFORM: macos-x86_64

build:macos-aarch64:
  extends: .build-macos
  variables:
    TARGET: aarch64-apple-darwin
    PLATFORM: macos-aarch64

# ---------------------------------------------------------------------------
# Publish — upload every tarball + sha256 to the Generic Package Registry,
# attach them as asset links on the Release, and append a neovim-style
# "Install" section to the release description.
# ---------------------------------------------------------------------------
publish:
  stage: publish
  image: alpine:latest
  tags:
    - ci0X-evolix
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-paths
  needs:
    - release:semantic
    - build:linux-x86_64
    - build:linux-aarch64
    - build:macos-x86_64
    - build:macos-aarch64
  script:
    - apk add --no-cache curl jq
    - VERSION=$(cat version.txt)
    - TAG="v${VERSION}"
    - RELEASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/${TAG}"
    # 1. Upload tarballs + sha256 files to the generic package registry.
    - |
      for f in dist/*.tar.gz dist/*.sha256; do
        name=$(basename "$f")
        echo "Uploading $name"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${PACKAGE_REGISTRY_URL}/${VERSION}/${name}"
      done
    # 2. Attach asset links (tarball + checksum) for each platform.
    - |
      for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
        archive="${PACKAGE_NAME}-${platform}.tar.gz"
        tarball_url="${PACKAGE_REGISTRY_URL}/${VERSION}/${archive}"
        sha_url="${PACKAGE_REGISTRY_URL}/${VERSION}/${archive}.sha256"
        echo "Linking $platform"
        curl --fail --silent --show-error --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data "name=${archive}" \
          --data-urlencode "url=${tarball_url}" \
          --data "link_type=package" \
          "${RELEASE_API}/assets/links" >/dev/null
        curl --fail --silent --show-error --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data "name=${archive}.sha256" \
          --data-urlencode "url=${sha_url}" \
          --data "link_type=other" \
          "${RELEASE_API}/assets/links" >/dev/null
      done
    # 3. Append a neovim-style "Install" section to the release description,
    #    keeping the semantic-release changelog underneath.
    - |
      existing=$(curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "${RELEASE_API}" | jq -r '.description // ""')
      {
        echo "**${PACKAGE_NAME} v${VERSION}**"
        echo ""
        echo "Build type: Release"
        echo ""
        echo "## Install"
        echo ""
        echo "Each tarball bundles the \`${BINARY_NAME}\` binary **and** the \`claude/\` + \`opencode/\` catalogues, so the installer can locate its items without cloning the repo."
        echo ""
        echo "### One-liner (recommended)"
        echo ""
        echo "\`\`\`bash"
        echo "curl -fsSL https://gitlab.com/delupay/tooling/skills-manager/-/raw/main/install.sh | sh"
        echo "\`\`\`"
        echo ""
        echo "Detects your OS + arch, downloads the matching tarball from this Release, installs it to \`~/.local/share/skills-manager\`, and symlinks the binary into \`~/.local/bin\`. Set \`GITLAB_TOKEN\` first if your client needs an authenticated pull."
        echo ""
        echo "### Manual — pick your platform"
        echo ""
        echo "### macOS (Apple Silicon)"
        echo "\`\`\`bash"
        echo "curl -LO \"${PACKAGE_REGISTRY_URL}/${VERSION}/${PACKAGE_NAME}-macos-aarch64.tar.gz\""
        echo "xattr -c ./${PACKAGE_NAME}-macos-aarch64.tar.gz"
        echo "tar xzvf ${PACKAGE_NAME}-macos-aarch64.tar.gz"
        echo "./${PACKAGE_NAME}-macos-aarch64/${BINARY_NAME}"
        echo "\`\`\`"
        echo ""
        echo "### macOS (Intel)"
        echo "\`\`\`bash"
        echo "curl -LO \"${PACKAGE_REGISTRY_URL}/${VERSION}/${PACKAGE_NAME}-macos-x86_64.tar.gz\""
        echo "xattr -c ./${PACKAGE_NAME}-macos-x86_64.tar.gz"
        echo "tar xzvf ${PACKAGE_NAME}-macos-x86_64.tar.gz"
        echo "./${PACKAGE_NAME}-macos-x86_64/${BINARY_NAME}"
        echo "\`\`\`"
        echo ""
        echo "### Linux (x86_64)"
        echo "\`\`\`bash"
        echo "curl -LO \"${PACKAGE_REGISTRY_URL}/${VERSION}/${PACKAGE_NAME}-linux-x86_64.tar.gz\""
        echo "tar xzvf ${PACKAGE_NAME}-linux-x86_64.tar.gz"
        echo "./${PACKAGE_NAME}-linux-x86_64/${BINARY_NAME}"
        echo "\`\`\`"
        echo ""
        echo "### Linux (aarch64)"
        echo "\`\`\`bash"
        echo "curl -LO \"${PACKAGE_REGISTRY_URL}/${VERSION}/${PACKAGE_NAME}-linux-aarch64.tar.gz\""
        echo "tar xzvf ${PACKAGE_NAME}-linux-aarch64.tar.gz"
        echo "./${PACKAGE_NAME}-linux-aarch64/${BINARY_NAME}"
        echo "\`\`\`"
        echo ""
        echo "### Put it on your PATH (optional)"
        echo "\`\`\`bash"
        echo "mv ${PACKAGE_NAME}-<platform> ~/.local/share/${PACKAGE_NAME}"
        echo "mkdir -p ~/.local/bin"
        echo "ln -sf ~/.local/share/${PACKAGE_NAME}/${BINARY_NAME} ~/.local/bin/${BINARY_NAME}"
        echo "\`\`\`"
        echo "The binary follows its own symlink to find the catalogue — it will keep working from anywhere on your PATH."
        echo ""
        echo "### Checksums"
        echo ""
        echo "Each tarball ships a \`.sha256\` sidecar attached to this Release — verify with \`shasum -a 256 -c <file>.sha256\`."
        echo ""
        echo "---"
        echo ""
        echo "$existing"
      } > release-body.md
      jq -Rs '{description: .}' release-body.md > release-body.json
      curl --fail --silent --show-error --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "@release-body.json" \
        "${RELEASE_API}" >/dev/null
      echo "Release description updated."
